# ============================================================
# real_params.yaml  —  Real hardware parameter overrides
# ============================================================
# Loaded by mission.launch.py (hardware launch, to be built).
# Update all values below with physically measured quantities
# before first hardware deployment.
# ============================================================

gate_navigator_v2_node:
  ros__parameters:
    confidence_threshold:    0.10
    commit_distance:         5.5
    commit_ticks_required:   5
    align_threshold:         0.05
    align_ticks_required:    8
    cross_overshoot:         2.5
    gate_odom_freeze_dist:   6.0
    max_gate_odom_jump:      1.0
    # TODO: measure from real robot (CAD or ruler)
    cam_offset_fwd:          0.30    # m — UPDATE WITH REAL MEASUREMENT
    cam_offset_left:         0.06    # m — UPDATE WITH REAL MEASUREMENT
    stop_pause_ticks:        20
    yolo_freshness_sec:      1.5
    search_spin_speed:       0.10    # slower on real hardware (less drag compensation)
    track_speed:             0.10    # m/s — conservative for first real run
    cross_speed:             0.15    # m/s — conservative for first real run
    track_p_gain:            1.5
    align_p_gain:            4.0
    angular_clamp:           0.30

gate_detector_node:
  ros__parameters:
    confidence_threshold:    0.10
    debug_image_dir:         ''

gate_localizer_node:
  ros__parameters:
    confidence_threshold:    0.10
    stereo_baseline:         0.12    # m — UPDATE WITH REAL MEASURED BASELINE

mission_logger_node:
  ros__parameters:
    log_dir:  '~/auv_ws/mission_logs'

trail_mapper_node:
  ros__parameters:
    min_dist_m:   0.10
    publish_hz:   1.0
    odom_frame:   'odom'   # real hardware uses 'odom' from robot_localization EKF
    log_dir:      '~/auv_ws/mission_logs'

# Real Hardware Sensors Layer
depth_sensor:
  ros__parameters:
    surface_z:             0.0
    water_density:         1025.0
    atmospheric_pressure:  101325.0
    gravity:               9.81
    publish_rate_hz:       20.0

dvl_sensor:
  ros__parameters:
    publish_rate_hz:       20.0
    velocity_noise_std:    0.005
    altitude_noise_std:    0.01
    pool_floor_z:          -5.0
    max_range_m:           50.0
    min_range_m:           0.1
    beam_angle_deg:        25.0
    frame_id:              'dvl_link'
    base_frame_id:         'base_link'
    odom_frame_id:         'odom'

sensor_fusion_node:
  ros__parameters:
    imu_topic:             '/auv/imu'
    mag_topic:             '/auv/magnetometer'
    depth_topic:           '/auv/depth'
    dvl_topic:             '/auv/dvl/velocity'
    publish_rate_hz:       50.0
    alpha_tilt:            0.05
    beta_yaw:              0.04
    gamma_depth:           0.15
    magnetic_declination_deg: 0.0

safety_supervisor_node:
  ros__parameters:
    leak_topic:            '/auv/leak'
    battery_topic:         '/auv/battery'
    imu_topic:             '/auv/imu'
    depth_topic:           '/auv/depth'
    cmd_vel_topic:         '/model/auv_box/cmd_vel'
    monitor_rate_hz:       10.0
    min_battery_voltage:   13.6
    min_battery_percentage: 0.15
    max_tilt_deg:          50.0
    max_depth_m:           8.0
    emergency_surface_vel: 0.30
    auto_override_cmd_vel: true
